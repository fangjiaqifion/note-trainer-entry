<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Note Trainer · 云端授权</title>
<link rel="stylesheet" href="./portal_style.css?v=2d650f3b0e">
<script type="module" src="./entry.mjs?build=4fd09d5452"></script></head>
<body><main class="entry">
<header><h1>识谱小练习</h1><a class="admin-link" href="./manage.html">管理员登录</a></header>
<p id="status" role="status" aria-live="polite"></p>
<div class="entry-grid">
<form id="login"><h2>教师登录</h2><label>用户名<input name="username" autocomplete="username" autocapitalize="none" required></label><label>教师密钥<input name="key" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<form id="register"><h2>教师注册</h2><label>邀请码<input name="invitation" type="password" autocomplete="off" required></label><label>用户名<input name="username" autocomplete="username" autocapitalize="none" required></label><button>注册</button></form>
<section class="card issued" id="issued" hidden><h2>保存教师密钥</h2><p>换设备时需要它。</p><textarea id="key" readonly aria-label="教师密钥"></textarea><button id="continue">已保存，进入练习</button></section>
<form id="learner" class="learner"><h2>学生激活或恢复</h2><label>学生激活码<textarea name="packet" autocomplete="off" spellcheck="false" required></textarea></label><button>激活或恢复</button></form>
</div>
</main></body></html>
